<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#070a13">
<title>Trend Machine</title>
<link rel="icon" href="/icons/favicon-32.png">
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url("/fonts/Inter-latin.woff2") format("woff2"); }
@font-face { font-family: "JetBrains Mono"; font-weight: 100 800; font-display: swap; src: url("/fonts/JetBrainsMono-latin.woff2") format("woff2"); }
:root { --brand: linear-gradient(120deg, #8b7cff 0%, #38c6f4 100%); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; color: #e8ecf6; font: 14px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
body { display: grid; place-items: center; overflow: hidden;
  background: radial-gradient(700px 420px at 30% 20%, rgba(139,124,255,.22), transparent 60%), radial-gradient(700px 480px at 75% 80%, rgba(56,198,244,.14), transparent 60%), #070a13; }
body::before { content: ""; position: fixed; inset: 0; background-image: linear-gradient(rgba(148,163,214,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,214,.04) 1px, transparent 1px);
  background-size: 32px 32px; mask-image: radial-gradient(ellipse at 50% 50%, #000 20%, transparent 70%); pointer-events: none; }
svg.bg { position: fixed; inset: auto 0 0 0; width: 100%; height: 45vh; opacity: .35; pointer-events: none; }
svg.bg path { fill: none; stroke: url(#lg); stroke-width: 2; stroke-dasharray: 2400; stroke-dashoffset: 2400; animation: draw 4s ease-out forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
form { position: relative; width: min(360px, 90vw); padding: 34px 30px 26px; display: flex; flex-direction: column; gap: 16px; border-radius: 18px;
  background: rgba(18, 23, 40, .72); border: 1px solid rgba(148,163,214,.15); backdrop-filter: blur(18px); box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.05); }
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
.emb { width: 52px; height: 52px; border-radius: 50%; box-shadow: 0 8px 24px rgba(56,198,244,.35); }
.logo { font-weight: 800; letter-spacing: 3px; font-size: 21px; background: var(--brand); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { color: #5d6888; font-size: 11.5px; margin-top: -3px; }
label { display: flex; flex-direction: column; gap: 6px; color: #98a3c0; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; }
input { background: rgba(7,10,19,.6); border: 1px solid rgba(148,163,214,.2); border-radius: 10px; color: inherit; font: 15px "JetBrains Mono", monospace; padding: 11px 12px; outline: none; transition: border-color .2s, box-shadow .2s; }
input:focus { border-color: #8b7cff; box-shadow: 0 0 0 3px rgba(139,124,255,.2); }
button { background: var(--brand); color: #0a0d18; border: 0; border-radius: 10px; padding: 12px; font: 700 13px Inter, sans-serif; letter-spacing: 2px; cursor: pointer; transition: transform .15s, box-shadow .2s; box-shadow: 0 8px 24px rgba(139,124,255,.35); }
button:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(139,124,255,.45); }
.err { color: #ff5c8a; min-height: 18px; font-size: 12px; }
.foot { color: #5d6888; font-size: 10.5px; text-align: center; }
[hidden] { display: none; }
@media (prefers-reduced-motion: reduce) { svg.bg path { animation: none; stroke-dashoffset: 0; } }
</style>
</head>
<body>
<svg class="bg" viewBox="0 0 1200 300" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff"/><stop offset="1" stop-color="#2ee6a8"/></linearGradient></defs>
<path d="M0 240 L80 220 L140 236 L210 190 L280 205 L350 160 L410 178 L480 130 L560 150 L620 110 L700 128 L770 84 L840 104 L910 70 L990 92 L1060 50 L1130 66 L1200 30"/></svg>
<form id="lf" autocomplete="on">
  <div class="top">
    <img class="emb" src="/icons/icon-192.png" alt="">
    <div><div class="logo">TREND MACHINE</div><div class="sub">Futures direction terminal</div></div>
  </div>
  <label>Password <input id="pw" type="password" autocomplete="current-password" required autofocus></label>
  <label id="codewrap" hidden>2-step code <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="7"></label>
  <button type="submit">ENTER</button>
  <div id="err" class="err" role="alert"></div>
  <div class="foot">Private terminal · single owner</div>
</form>
<script src="/login.js"></script>
</body>
</html>
