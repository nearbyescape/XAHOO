# Nginx on the host (same style most VPS setups use for NearbyEscape/XP).
# 1) sudo cp deploy/nginx/xahoo.chaliyaboy.com.conf /etc/nginx/sites-available/
# 2) sudo ln -s /etc/nginx/sites-available/xahoo.chaliyaboy.com.conf /etc/nginx/sites-enabled/
# 3) sudo nginx -t && sudo systemctl reload nginx          (only reloads if the config test passes)
# 4) sudo certbot --nginx -d xahoo.chaliyaboy.com           (adds HTTPS + redirect automatically)
server {
    listen 80;
    listen [::]:80;
    server_name xahoo.chaliyaboy.com;

    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;      # one hop only: the login lockout uses the last hop
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
